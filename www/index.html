<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Matthew’s Catch my Rhythm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0620; --ink:#f4f0ff; --dim:#a99bd6; --cyan:#5ff6ff; --pink:#ff2e88; --panel:rgba(10,6,28,.72);
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0b0620; --ink:#f4f0ff; } }
:root[data-theme="dark"]{ --bg:#0b0620; --ink:#f4f0ff; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;display:block;touch-action:none}
.disp{font-family:"Bungee","Arial Black",Impact,sans-serif;font-weight:400}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2vh;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 12px);overflow:auto}
.hidden{display:none!important}
.screen{justify-content:safe center}
.studio{justify-content:flex-start;gap:8px;background:rgba(8,5,25,.9);padding-left:calc(env(safe-area-inset-left,0px) + 10px);padding-right:calc(env(safe-area-inset-right,0px) + 10px)}
.stTop{display:flex;gap:8px;align-items:center;width:100%;flex-wrap:wrap}
.ico{all:unset;cursor:pointer;font-size:20px;width:40px;height:40px;display:grid;place-items:center;border-radius:10px;background:var(--panel);border:1px solid #3a2a6a}
#stName,#lvName{flex:1;min-width:120px;font:16px "Bungee","Arial Black",sans-serif;color:var(--ink);background:var(--panel);border:1px solid #3a2a6a;border-radius:10px;padding:8px 12px;outline:none}
.slots{display:flex;gap:4px}
.slots button{all:unset;cursor:pointer;font:14px "Bungee","Arial Black",sans-serif;padding:9px 12px;border-radius:10px;background:var(--panel);border:1px solid #3a2a6a;color:var(--dim)}
.slots button.on{background:#ffe45c;color:#2a1a00;border-color:#ffe45c}
.stBody{display:flex;gap:10px;width:100%;flex:1;min-height:0}
.stCtl{width:clamp(160px,24vw,220px);display:flex;flex-direction:column;gap:6px;overflow:auto}
.opt{display:flex;gap:4px}
.opt button,.row2 button{all:unset;cursor:pointer;flex:1;text-align:center;padding:7px 2px;border-radius:9px;background:var(--panel);border:1px solid #3a2a6a;font-size:13px;color:var(--ink);white-space:nowrap}
.opt button.on{background:var(--cyan);color:#06121a;border-color:var(--cyan)}
.row2{display:flex;gap:4px}
.olab{font-size:11px;color:var(--dim);margin:2px 0 -2px}
#stPlay{all:unset;cursor:pointer;text-align:center;font:18px "Bungee","Arial Black",sans-serif;padding:10px;border-radius:12px;background:#ffe45c;color:#2a1a00}
#stGo{text-align:center;font-size:15px;padding:10px 6px}
.grid{flex:1;display:grid;grid-template-columns:30px repeat(16,1fr);grid-template-rows:repeat(9,1fr);gap:3px;min-height:220px}
.grid .lab{display:grid;place-items:center;font-size:18px}
.grid .cell{border-radius:6px;background:color-mix(in srgb,var(--rc) 14%,transparent);cursor:pointer}
.grid .cell.b4{background:color-mix(in srgb,var(--rc) 24%,transparent)}
.grid .cell.on{background:var(--rc);box-shadow:0 0 10px -2px var(--rc)}
.grid .cell.ph{outline:2px solid rgba(255,255,255,.75)}
.mrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.mrow .btn{font-size:15px;padding:10px 16px}
.songb{all:unset;cursor:pointer;font:13px "Bungee","Arial Black",sans-serif;padding:10px 12px;border-radius:10px;background:var(--panel);border:1px solid #3a2a6a;color:var(--ink);white-space:nowrap}
.pal{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.pal button{all:unset;cursor:pointer;aspect-ratio:1;border-radius:8px;border:2px solid rgba(255,255,255,.15)}
.pal button.tr{background:repeating-conic-gradient(#555 0 25%,#999 0 50%) 0 0/10px 10px}
.pal button.on{border-color:#fff;box-shadow:0 0 0 2px #ffe45c}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.tools button{all:unset;cursor:pointer;text-align:center;padding:5px 0;border-radius:9px;background:var(--panel);border:1px solid #3a2a6a;font-size:18px;line-height:1.1}
.tools button small{display:block;font-size:10px;color:var(--dim)}
.tools button.on{background:var(--cyan);border-color:var(--cyan)}
.tools button.on small{color:#06121a}
.artWrap{flex:1;display:flex;align-items:center;justify-content:center;gap:12px;min-height:0;min-width:0}
#artCv{border-radius:10px;touch-action:none;box-shadow:0 0 0 2px #3a2a6a;flex:none}
#artPrev{width:96px;height:96px;border-radius:12px;align-self:flex-end;flex:none}
.lvMain{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;min-height:0}
#lvCv{border-radius:10px;touch-action:none;box-shadow:0 0 0 2px #3a2a6a;flex:none}
.tl{width:100%;display:flex;overflow-x:auto;gap:2px;flex:none;height:48px;padding-bottom:4px;touch-action:pan-x}
.tl button{all:unset;cursor:pointer;flex:none;width:26px;height:40px;border-radius:6px;background:color-mix(in srgb,var(--sc) 60%,#000);font-size:11px;color:#fff;text-align:center;display:flex;flex-direction:column;justify-content:space-between;padding:2px 0;box-sizing:border-box}
.tl button.bar{margin-left:6px}
.tl button i{font-style:normal;color:#ffe45c;font-size:9px;letter-spacing:-1px}
.tl button.sel{outline:2px solid #fff;background:var(--sc)}
@media (max-aspect-ratio:1/1){.stBody{flex-direction:column}.stCtl{width:auto;flex-direction:row;flex-wrap:wrap}.stCtl>*{flex:1 1 45%}}
.logo{margin:0;text-align:center;line-height:.9}
.logo small{display:block;font-size:clamp(16px,3.6vmin,30px);color:var(--cyan);letter-spacing:.12em}
.logo big{display:block;font-size:clamp(30px,9vmin,80px);letter-spacing:.01em;
  background:linear-gradient(90deg,#ff2e88,#ffb23e 45%,#5ff6ff);-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:thump .508s infinite;filter:drop-shadow(0 0 18px rgba(255,46,136,.55))}
@keyframes thump{0%{transform:scale(1.06)}30%{transform:scale(1)}100%{transform:scale(1)}}
.stages{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;max-width:820px}
.card{all:unset;cursor:pointer;width:clamp(150px,27vw,220px);padding:12px 14px;border-radius:14px;background:var(--panel);
  border:2px solid var(--c);box-shadow:0 0 18px -4px var(--c),inset 0 0 22px -12px var(--c);display:flex;flex-direction:column;gap:4px;transition:transform .12s}
.card:active{transform:scale(.96)}
.card .nm{font-family:"Bungee","Arial Black",sans-serif;font-size:clamp(16px,3.2vmin,22px);color:var(--c)}
.card .sb{font-size:13px;color:var(--dim)}
.card .bs{font-size:13px}
.card .bs b{font-family:"Bungee","Arial Black",sans-serif;font-size:18px;color:var(--c)}
.seg{display:flex;background:var(--panel);border-radius:999px;padding:4px;border:1px solid #3a2a6a}
.seg button{all:unset;cursor:pointer;padding:10px 18px;border-radius:999px;font-family:"Bungee","Arial Black",sans-serif;font-size:14px;color:var(--dim)}
.seg button.on{background:var(--cyan);color:#06121a}
.how{max-width:560px;text-align:center;color:var(--ink);font-size:16px;line-height:1.5;margin:0}
.btn{all:unset;cursor:pointer;font-family:"Bungee","Arial Black",sans-serif;font-size:18px;padding:12px 26px;border-radius:12px;
  background:var(--cyan);color:#06121a;box-shadow:0 0 22px -4px var(--cyan)}
.btn.alt{background:transparent;color:var(--ink);border:2px solid #5a4a8a;box-shadow:none}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.rank{font-size:clamp(60px,20vmin,150px);line-height:1;margin:0;letter-spacing:.1em}
.big{font-size:clamp(26px,6vmin,46px);margin:0;text-align:center}
.stat{color:var(--dim);margin:0;text-align:center}
.over{background:rgba(5,3,14,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#pauseBtn,#dashBtn{position:fixed;z-index:5;font-family:"Bungee","Arial Black",sans-serif;color:var(--ink);cursor:pointer;
  background:rgba(95,246,255,.10);border:2px solid rgba(95,246,255,.55);border-radius:50%;touch-action:none}
#pauseBtn{top:calc(env(safe-area-inset-top,0px) + 10px);right:calc(env(safe-area-inset-right,0px) + 12px);width:44px;height:44px;font-size:14px}
#dashBtn{bottom:calc(env(safe-area-inset-bottom,0px) + 18px);right:calc(env(safe-area-inset-right,0px) + 18px);width:84px;height:84px;font-size:14px}
#dashBtn.cd{opacity:.35}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="menu" class="screen">
  <h1 class="logo disp"><small>Matthew’s</small><big>Catch my Rhythm</big></h1>
  <div class="seg" id="diffs"></div>
  <div class="stages" id="stages"></div>
  <div class="mrow"><button class="btn alt" id="toStudio">🎹 Music Studio</button><button class="btn alt" id="toArt">🎨 Art Studio</button><button class="btn alt" id="toLevel">🗺️ Level Maker</button></div>
  <p class="how">👆 Slide your finger to move. ⭐ Catch the happy stars! 🚫 Don’t touch the glowing shapes. 💨 Tap ZOOM to whoosh past danger. Easy Peasy can’t be lost — just have fun!</p>
</div>

<div id="studio" class="screen studio hidden">
  <div class="stTop">
    <button class="ico" id="stBack" aria-label="Back">⬅</button>
    <div class="slots" id="slots"></div>
    <input id="stName" maxlength="22" aria-label="Song name">
    <button class="ico" id="stDice" aria-label="New name">🎲</button>
  </div>
  <div class="stBody">
    <div class="stCtl">
      <button id="stPlay">▶ Listen</button>
      <div class="olab">Speed</div><div class="opt" id="optSpeed"></div>
      <div class="olab">Mood</div><div class="opt" id="optMood"></div>
      <div class="olab">Sound</div><div class="opt" id="optInst"></div>
      <div class="row2"><button id="stRand">🎲 Surprise</button><button id="stClear">🧽 Clear</button></div>
      <button class="btn" id="stGo">🎮 Play my song!</button>
    </div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<div id="art" class="screen studio hidden">
  <div class="stTop">
    <button class="ico" id="artBack" aria-label="Back">⬅</button>
    <div class="slots" id="artKinds"></div>
    <button class="songb" id="artUse">✅ In game</button>
  </div>
  <div class="stBody">
    <div class="stCtl"><div class="pal" id="artPal"></div><div class="tools" id="artTools"></div></div>
    <div class="artWrap" id="artWrap"><canvas id="artCv"></canvas><canvas id="artPrev" width="192" height="192"></canvas></div>
  </div>
</div>

<div id="lvled" class="screen studio hidden">
  <div class="stTop">
    <button class="ico" id="lvBack" aria-label="Back">⬅</button>
    <div class="slots" id="lvSlots"></div>
    <input id="lvName" maxlength="22" aria-label="Level name">
    <button class="ico" id="lvDice" aria-label="New name">🎲</button>
    <button class="songb" id="lvSong">🎵</button>
  </div>
  <div class="stBody">
    <div class="stCtl">
      <div class="tools" id="lvTools"></div>
      <div class="row2"><button id="lvPrev">◀ Beat</button><button id="lvNext">Beat ▶</button></div>
      <div class="row2"><button id="lvRepeat">➡️ Repeat</button><button id="lvClearB">🧽 Beat</button></div>
      <div class="row2"><button id="lvTest">▶ Test</button><button id="lvClearAll">🗑️ All</button></div>
      <button class="btn" id="lvGo">🎮 Play level!</button>
    </div>
    <div class="lvMain" id="lvMain"><canvas id="lvCv"></canvas><div class="tl" id="lvTl"></div></div>
  </div>
</div>

<div id="pause" class="screen over hidden">
  <p class="big disp">Paused</p>
  <div class="row"><button class="btn" id="resume">Resume</button><button class="btn alt" id="quit">Menu</button></div>
</div>

<div id="result" class="screen over hidden">
  <p class="big disp" id="rTitle">You did it!</p>
  <p class="rank disp" id="rRank">S</p>
  <p class="stat" id="rStat"></p>
  <div class="row"><button class="btn" id="rNext">Next song</button><button class="btn alt" id="rRetry">Play again</button><button class="btn alt hidden" id="rStudio">🎹 Studio</button><button class="btn alt" id="rMenu">Menu</button></div>
</div>

<button id="pauseBtn" class="hidden" aria-label="Pause">II</button>
<button id="dashBtn" class="hidden">ZOOM</button>

<script>
"use strict";
const $=s=>document.querySelector(s);
const cv=$('#c'), g=cv.getContext('2d');
let W,H,DPR,U,AW,AH;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  cv.style.width=W+'px';cv.style.height=H+'px';U=Math.min(W,H)/9;AW=W/U;AH=H/U;}
addEventListener('resize',resize);resize();

/* ---------------- songs ---------------- */
const STAGES=[
 {id:'neon',name:'Bouncy Start',sub:'Easy song · 118 BPM',bpm:118,seed:11,lvl:.85,
  prog:[[57,'m'],[53,'M'],[48,'M'],[55,'M']],col:{haz:'#ff4fa3',bg:'#180c48',bg2:'#3a1b86',grid:'#4b2c9a'},
  sections:[['intro',4],['build',8],['drop',8],['break',4],['drop2',8],['outro',2]]},
 {id:'pulse',name:'Candy Pulse',sub:'Bouncy song · 128 BPM',bpm:128,seed:23,lvl:1,
  prog:[[50,'m'],[46,'M'],[53,'M'],[48,'M']],col:{haz:'#ff9a2e',bg:'#0a2246',bg2:'#13508a',grid:'#2367a3'},
  sections:[['intro',4],['build',8],['drop',8],['break',4],['drop2',12],['outro',2]]},
 {id:'hyper',name:'Rocket Ride',sub:'Fast song · 140 BPM',bpm:140,seed:37,lvl:1.2,
  prog:[[52,'m'],[48,'M'],[55,'M'],[50,'M']],col:{haz:'#c77dff',bg:'#0b1838',bg2:'#1f3b7a',grid:'#2f4f99'},
  sections:[['intro',4],['build',8],['drop',12],['break',4],['drop2',12],['outro',2]]}
];
const DIFFS=[{id:'easy',name:'Easy Peasy',hp:0,dens:.5,spd:.7},{id:'normal',name:'Normal',hp:5,dens:.85,spd:.9},{id:'hard',name:'Hard',hp:3,dens:1.15,spd:1.05}];
let selDiff=0, selStage=0;
const RANKS=['','1','2','3'];
function getBest(s,d){try{return localStorage.getItem('mr_stars_'+s+'_'+d)||'';}catch(e){return '';}}
function setBest(s,d,r){try{const o=getBest(s,d);if(RANKS.indexOf(r)>RANKS.indexOf(o))localStorage.setItem('mr_stars_'+s+'_'+d,r);}catch(e){}}
try{const v=localStorage.getItem('mr_diff2');if(v!==null)selDiff=+v||0;}catch(e){}

/* ---------------- audio ---------------- */
let AC=null,comp,sfxG,noiseBuf;
function initAudio(){
  if(AC)return;
  AC=new (window.AudioContext||window.webkitAudioContext)();
  comp=AC.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;comp.connect(AC.destination);
  sfxG=AC.createGain();sfxG.gain.value=.55;sfxG.connect(comp);
  noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
}
const mf=m=>440*Math.pow(2,(m-69)/12);
function env(gn,t,a,peak,d){gn.gain.setValueAtTime(.0001,t);gn.gain.exponentialRampToValueAtTime(Math.max(.0002,peak),t+a);gn.gain.exponentialRampToValueAtTime(.0001,t+a+d);}
function nz(t,dur){const s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;s.start(t);s.stop(t+dur+.05);return s;}
function filt(type,f,q){const b=AC.createBiquadFilter();b.type=type;b.frequency.value=f;if(q)b.Q.value=q;return b;}
function kick(r,t,v){const o=AC.createOscillator(),gn=AC.createGain();o.frequency.setValueAtTime(155,t);o.frequency.exponentialRampToValueAtTime(42,t+.13);
  env(gn,t,.004,.95*v,.32);o.connect(gn);gn.connect(r.out);o.start(t);o.stop(t+.45);
  r.bassBus.gain.setValueAtTime(.22,t);r.bassBus.gain.linearRampToValueAtTime(1,t+r.beat*.6);}
function snare(r,t,v){const s=nz(t,.2),f=filt('bandpass',1800,.8),gn=AC.createGain();env(gn,t,.002,.55*v,.17);s.connect(f);f.connect(gn);gn.connect(r.out);
  const o=AC.createOscillator(),g2=AC.createGain();o.type='triangle';o.frequency.value=190;env(g2,t,.002,.3*v,.08);o.connect(g2);g2.connect(r.out);o.start(t);o.stop(t+.15);}
function hat(r,t,v,open){const s=nz(t,open?.18:.06),f=filt('highpass',7500),gn=AC.createGain();env(gn,t,.001,.16*v,open?.14:.035);s.connect(f);f.connect(gn);gn.connect(r.out);}
function crash(r,t){const s=nz(t,1.8),f=filt('highpass',4000),gn=AC.createGain();env(gn,t,.005,.3,1.6);s.connect(f);f.connect(gn);gn.connect(r.out);gn.connect(r.delay);}
function riser(r,t,dur){const s=nz(t,dur),f=filt('bandpass',400,3),gn=AC.createGain();f.frequency.setValueAtTime(400,t);f.frequency.exponentialRampToValueAtTime(7000,t+dur);
  gn.gain.setValueAtTime(.0001,t);gn.gain.linearRampToValueAtTime(.32,t+dur);gn.gain.linearRampToValueAtTime(0,t+dur+.04);s.connect(f);f.connect(gn);gn.connect(r.out);}
function bass(r,t,m,dur,v){const o=AC.createOscillator(),o2=AC.createOscillator(),f=filt('lowpass',900,6),gn=AC.createGain();o.type='sawtooth';o.frequency.value=mf(m);o2.type='sine';o2.frequency.value=mf(m);
  f.frequency.setValueAtTime(1100,t);f.frequency.exponentialRampToValueAtTime(180,t+dur);env(gn,t,.005,.3*v,dur);o.connect(f);o2.connect(f);f.connect(gn);gn.connect(r.bassBus);
  o.start(t);o2.start(t);o.stop(t+dur+.1);o2.stop(t+dur+.1);}
function lead(r,t,m,dur,v){const f=filt('lowpass',2800,2),gn=AC.createGain();env(gn,t,.005,.075*v,dur);f.connect(gn);gn.connect(r.out);gn.connect(r.delay);
  for(const dt of [-7,7]){const o=AC.createOscillator();o.type='square';o.frequency.value=mf(m);o.detune.value=dt;o.connect(f);o.start(t);o.stop(t+dur+.1);}}
function pad(r,t,root,tones,dur,v){v=v||1;const f=filt('lowpass',1100),gn=AC.createGain();gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(.035*v,t+dur*.3);
  gn.gain.linearRampToValueAtTime(0,t+dur);f.connect(gn);gn.connect(r.out);gn.connect(r.delay);
  for(const k of tones){const o=AC.createOscillator();o.type='sawtooth';o.frequency.value=mf(root+k);o.detune.value=(Math.random()-.5)*14;o.connect(f);o.start(t);o.stop(t+dur+.05);}}
function sfxHit(){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),gn=AC.createGain();o.type='triangle';o.frequency.setValueAtTime(520,t);o.frequency.exponentialRampToValueAtTime(180,t+.25);
  env(gn,t,.003,.4,.28);o.connect(gn);gn.connect(sfxG);o.start(t);o.stop(t+.35);}
function sfxStar(n){if(!AC)return;const t=AC.currentTime,sc=[72,74,76,79,81,84,86,88];[0,.07].forEach((d,i)=>{const o=AC.createOscillator(),gn=AC.createGain();o.type='sine';
  o.frequency.value=mf(sc[(n+i*2)%sc.length]);env(gn,t+d,.003,.22,.22);o.connect(gn);gn.connect(sfxG);o.start(t+d);o.stop(t+d+.3);});}
function sfxDash(){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),gn=AC.createGain();o.type='sine';o.frequency.setValueAtTime(300,t);o.frequency.exponentialRampToValueAtTime(1400,t+.12);
  env(gn,t,.003,.25,.12);o.connect(gn);gn.connect(sfxG);o.start(t);o.stop(t+.2);}

function makeBus(bpm){const beat=60/bpm;const out=AC.createGain();out.gain.value=.9;out.connect(comp);
  const delay=AC.createDelay(1);delay.delayTime.value=beat*.75;const fb=AC.createGain();fb.gain.value=.32;const dl=AC.createGain();dl.gain.value=.45;
  delay.connect(fb);fb.connect(delay);delay.connect(dl);dl.connect(out);const bassBus=AC.createGain();bassBus.connect(out);
  return {out,delay,bassBus,beat,step:beat/4};}
const MEL=[81,79,76,74,72];
function melNote(r,t,m,dur,v,type){
  if(type==='bell'){const gn=AC.createGain();env(gn,t,.003,.2*v,dur*3);gn.connect(r.out);gn.connect(r.delay);
    for(const [mul,a] of [[1,1],[2,.35],[3,.12]]){const o=AC.createOscillator(),g2=AC.createGain();o.type='sine';o.frequency.value=mf(m)*mul;g2.gain.value=a;o.connect(g2);g2.connect(gn);o.start(t);o.stop(t+dur*3+.1);}}
  else if(type==='laser'){const o=AC.createOscillator(),f=filt('lowpass',3200),gn=AC.createGain();o.type='sawtooth';o.frequency.setValueAtTime(mf(m)*2.2,t);o.frequency.exponentialRampToValueAtTime(mf(m),t+.06);
    env(gn,t,.003,.085*v,dur);o.connect(f);f.connect(gn);gn.connect(r.out);gn.connect(r.delay);o.start(t);o.stop(t+dur+.1);}
  else lead(r,t,m,dur,v);
}
function playCustom(r,n,t){
  const bar=Math.floor(n/16),s=n%16,sc=r.barSec?r.barSec[bar]:{type:'drop',i:1,len:8},ty=sc.type,b=sc.i,L=sc.len,last=b===L-1;
  const P=r.st.pat,ch=r.st.prog[bar%4],root=ch[0],tones=ch[1]==='m'?[0,3,7]:[0,4,7];
  const drums=ty!=='break'&&ty!=='outro',intro=ty==='intro';
  if(drums){if(P[8][s])kick(r,t,intro?.8:1.1);if(!intro&&P[7][s])snare(r,t,.9);if(P[6][s])hat(r,t,intro?.5:.8,s%4===2);if(P[5][s])bass(r,t,root-12,r.step*1.6,intro?.6:1);}
  if(!intro&&ty!=='outro')for(let k=0;k<5;k++)if(P[k][s])melNote(r,t,MEL[k]+(ty==='drop2'&&bar%2?12:0),r.step*1.8,ty==='break'?.6:.9,r.st.inst);
  if(s===0)pad(r,t,root,tones,r.beat*4,ty==='break'||ty==='outro'||intro?1.1:.45);
  if(ty==='build'&&b>=L-2){const ev=last?(s>=8?1:2):4;if(s%ev===0)snare(r,t,last?.35+.6*s/16:.5);if(b===L-2&&s===0)riser(r,t,r.beat*8);}
  if(ty==='break'&&last){if(s%2===0)snare(r,t,.3+s/24);if(s===0)riser(r,t,r.beat*4);}
  if((ty==='drop'||ty==='drop2')&&b===0&&s===0)crash(r,t);
  if(ty==='outro'&&b===0&&s===0){kick(r,t,1.1);crash(r,t);}
}
const RB=['#ff5a5a','#ff9a2e','#ffd93b','#5bdc6b','#4ab3ff','#c77dff'];
function feverLayer(r,n,t){const rel=t-r.start;if(!(r.feverEnd>0&&rel>=r.feverStart&&rel<r.feverEnd))return;
  const s=n%16;hat(r,t,.7,false);if(s%8===4)snare(r,t,.7);
  if(s%2===0){const sc=[84,88,91,96,91,88];melNote(r,t,sc[(n/2|0)%6],r.step*1.5,.7,'bell');}}
function sfxPop(){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),gn=AC.createGain();o.type='square';o.frequency.setValueAtTime(900,t);o.frequency.exponentialRampToValueAtTime(1800,t+.06);
  env(gn,t,.002,.15,.09);o.connect(gn);gn.connect(sfxG);o.start(t);o.stop(t+.15);}
function sfxFever(){if(!AC)return;const t=AC.currentTime;[72,76,79,84,88,91].forEach((m,i)=>{const o=AC.createOscillator(),gn=AC.createGain();o.type='triangle';o.frequency.value=mf(m);
  env(gn,t+i*.06,.003,.25,.25);o.connect(gn);gn.connect(sfxG);o.start(t+i*.06);o.stop(t+i*.06+.35);});}
function playStep(r,n,t){
  feverLayer(r,n,t);
  if(r.st.custom){playCustom(r,n,t);return;}
  const bar=Math.floor(n/16),s=n%16,sc=r.barSec[bar],ty=sc.type,b=sc.i,L=sc.len,ch=r.st.prog[bar%4];
  const tones=ch[1]==='m'?[0,3,7]:[0,4,7],root=ch[0],last=b===L-1;
  if(ty==='intro'){
    if(s%8===0)kick(r,t,.7); if(s%4===2)hat(r,t,.5); if(s===0)pad(r,t,root,tones,r.beat*4);
    if(b>=2&&s%4===2)bass(r,t,root-24,r.step*1.6,.6);
  }else if(ty==='build'){
    if(s%4===0)kick(r,t,1);
    if(s%4===2){hat(r,t,1,true);bass(r,t,root-24,r.step*1.8,1);}else if(s%2===1)hat(r,t,.5);
    if(b>=L-2){const ev=last?(s>=8?1:2):4;if(s%ev===0)snare(r,t,last?.35+.6*s/16:.5);if(b===L-2&&s===0)riser(r,t,r.beat*8);}
    else if(s===4||s===12)snare(r,t,.7);
    if(b>=4&&s%2===0)lead(r,t,root+12+tones[(s/2)%3],r.step*1.5,.5);
  }else if(ty==='drop'||ty==='drop2'){
    if(s%4===0)kick(r,t,1.1); if(s%8===4)snare(r,t,.9); if(s%2===1)hat(r,t,.6); if(s%4===2)hat(r,t,1,true);
    if(s%4!==0)bass(r,t,root-24+(s%4===3?12:0),r.step*.9,1);
    const arp=[0,1,2,3,2,1],k=arp[n%6],note=root+12+(k===3?12:tones[k]);
    lead(r,t,note+(ty==='drop2'&&bar%2?12:0),r.step*.9,.9);
    if(b===0&&s===0)crash(r,t); if(s===0)pad(r,t,root,tones,r.beat*4,.5);
  }else if(ty==='break'){
    if(s===0)pad(r,t,root,tones,r.beat*4,1.2);
    if(s%4===0)lead(r,t,root+12+tones[(s/4)%3]+(s===12?12:0),r.step*3,.45);
    if(s%4===2)hat(r,t,.3);
    if(last){if(s%2===0)snare(r,t,.3+s/24);if(s===0)riser(r,t,r.beat*4);}
  }else{
    if(b===0&&s===0){kick(r,t,1.1);crash(r,t);} if(s===0)pad(r,t,root,tones,r.beat*4,1);
  }
}

/* ---------------- chart (hazards locked to the beat) ---------------- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function buildChart(st,df,beat){
  const R=mulberry(st.seed*7+df.hp*131),D=df.dens*st.lvl,S=df.spd*(.85+.15*st.lvl),bar=beat*4,E=[];
  const rn=(a,b)=>a+R()*(b-a),pk=a=>a[(R()*a.length)|0],chill=df.id==='easy',tel=beat*(chill?2:1),every=D<.8?2:1;
  const ring=(t,fx,fy,gw)=>{const sp=5.5*S;E.push({k:'ring',t,t0:t-tel,fx,fy,ga:R()*6.283,gw:gw||rn(1.05,1.45)/(D>1.1?1.12:1),sp,th:.38,t1:t+28/sp});};
  const laser=(t,dir,f)=>E.push({k:'laser',t,t0:t-tel,dir:dir||(R()<.5?'h':'v'),f:f!=null?f:rn(.12,.88),w:rn(.8,1.25),dur:beat*.6,t1:t+beat*.6+.3});
  const burst=(t,fx,fy)=>{const sp=4.2*S;E.push({k:'burst',t,t0:t-tel,fx,fy,n:Math.round(5+4*D),sp,ph:R()*6.28,t1:t+28/sp});};
  const wall=(t,side,gf)=>{const sp=4.4*S;E.push({k:'wall',t,t0:t-tel,side,gf:gf!=null?gf:rn(.22,.78),gs:2.7/(D>1.1?1.12:1),sp,th:.7,t1:t+32/sp});};
  const spin=(t,len,fx,fy)=>E.push({k:'spin',t,t0:t-beat,end:t+len,t1:t+len+.3,fx,fy,arms:chill?2:(D>1.1?4:3),len:rn(3.4,4.8),w:.36,
    om:(R()<.5?1:-1)*(Math.PI/2)/(beat*2)*(D>1.1?1.25:1),ph:R()*6.28});
  const tiles=(t,n,fixed)=>E.push({k:'tiles',t,t0:t-2*beat,fixed,n:n||Math.round(3+3*D),boom:beat*.5,t1:t+beat*.5+.3});
  const hole=(t,len,fx,fy)=>E.push({k:'hole',t,t0:t-beat,end:t+len,t1:t+len+.3,fx,fy,pull:2.1*S,om:2.2*(R()<.5?1:-1)});
  const note=(t,fx,fy)=>E.push({k:'note',t,t0:t-beat,fx,fy,t1:t+beat*(chill?4:2.5)});
  const inv=(t,len)=>E.push({k:'inv',t,t0:t-beat*2,end:t+len,t1:t+len});
  const edge=()=>{const u=rn(.1,.9);return pk([[.02,u],[.98,u],[u,.03],[u,.97]]);};
  const corner=()=>pk([[.08,.1],[.92,.1],[.08,.9],[.92,.9],[.5,.5]]);
  const sides=['l','r','t','b'];
  if(st.level){
    for(const it of st.level){const t=it.b*beat;
      if(it.k==='ring')ring(t,it.x,it.y);else if(it.k==='lh')laser(t,'h',it.y);else if(it.k==='lv')laser(t,'v',it.x);
      else if(it.k==='burst')burst(t,it.x,it.y);else if(it.k==='wall')wall(t,it.side,it.g);else if(it.k==='spin')spin(t,2*bar,it.x,it.y);
      else if(it.k==='bomb')tiles(t,1,[[it.x,it.y]]);else if(it.k==='star')note(t,it.x,it.y);}
    E.sort((a,b)=>a.t0-b.t0);return E;
  }
  if(st.custom){
    const P=st.pat,pickS=(row,max)=>{const o=[];let l=-9;for(let i=0;i<16;i++)if(P[row][i]&&i-l>=4){o.push(i);l=i;}return o.slice(0,max);};
    let kicks=pickS(8,chill?1:D>1.1?3:2);if(!kicks.length)kicks=chill?[0]:[0,8];
    let claps=pickS(7,chill?1:2);if(!claps.length)claps=[4];
    let bassS=pickS(5,1);if(!bassS.length)bassS=[2];
    const mel=[];{let l=-9;for(let i=0;i<16;i++)for(let k=0;k<5;k++)if(P[k][i]&&i-l>=3){mel.push([i,k]);l=i;break;}}
    const stars=mel.length>2?[mel[0],mel[Math.floor(mel.length/2)]]:mel.length?mel:[[4,2],[12,2]];
    let b0=0;
    for(const [type,len] of st.sections){
      for(let b=0;b<len;b++){
        const T0=(b0+b)*bar,at=i=>T0+i*beat/4,last=b===len-1;
        if(type!=='outro'&&!(type==='intro'&&b===0))for(const [i,k] of stars)note(at(i),rn(.12,.88),.18+k/4*.64);
        if(type==='intro'){if(b>=2)ring(at(kicks[0]),.5,.5,1.7);}
        else if(type==='build'){for(const i of kicks)ring(at(i),...corner());if(b%2)laser(at(claps[0]));if(b===len-2&&!chill)tiles(T0+2*beat);}
        else if(type==='drop'||type==='drop2'){
          if(type==='drop2'&&b===0&&!chill)inv(T0+bar,bar);
          for(const i of kicks)ring(at(i),...corner());
          if(b%2===0||!chill)for(const i of claps)laser(at(i));
          if(b%2===1)for(const i of bassS)burst(at(i),...edge());
          if(b%4===2)wall(T0,pk(sides));
          if(type==='drop2'&&b%4===1&&!chill)tiles(T0+2*beat);
        }
        else if(type==='break'){if(!last)ring(T0,.5,.5,2);}
        else if(b===0)for(let k=0;k<3;k++)ring(T0+k*beat*.5,.5,.5,1.8);
      }
      b0+=len;
    }
    E.sort((a,b)=>a.t0-b.t0);return E;
  }
  let bar0=0;
  for(const [type,len] of st.sections){
    let b=0;
    while(b<len){
      const T0=(bar0+b)*bar,last=b===len-1;let used=1;
      if(type!=='outro'&&!(type==='intro'&&b===0)){note(T0+beat,rn(.12,.88),rn(.15,.85));note(T0+3*beat,rn(.12,.88),rn(.15,.85));}
      if(type==='intro'){
        if(b>=1)ring(T0,.5,.5,1.7); if(b>=2)laser(T0+2*beat); if(b===3&&!chill)laser(T0+3*beat);
      }else if(type==='build'){
        if(last){for(let k=0;k<4;k+=every)ring(T0+k*beat,.5,.5);}
        else if(b===len-2){tiles(T0+2*beat);ring(T0,...corner());}
        else if(b===3){wall(T0,pk(sides));if(every===1)wall(T0+2*beat,pk(sides));}
        else if(b%2===0){for(let k=0;k<4;k+=every){laser(T0+k*beat);if(D>1.05&&b>=4&&k%2)laser(T0+k*beat);}}
        else{burst(T0,...edge());if(every===1)burst(T0+2*beat,...edge());}
      }else if(type==='drop'||type==='drop2'){
        if(b===0)ring(T0,.5,.5);
        if(type==='drop2'&&b===0&&!chill)inv(T0+bar,bar);
        const pool=['rings','lasers','bursts','walls','tiles'];if(len-b>=2&&b>0)pool.push('spin','spin');if(len-b>=2&&b>0&&!chill)pool.push('hole');
        const p=pk(pool);
        if(p==='rings'){for(let k=(b===0?1:0);k<4;k+=every)ring(T0+k*beat,...corner());}
        else if(p==='lasers'){for(let k=0;k<4;k+=every){laser(T0+k*beat);if(D>1&&k===3){laser(T0+k*beat,'h');laser(T0+k*beat,'v');}}}
        else if(p==='bursts'){for(let k=0;k<4;k+=every*2)burst(T0+k*beat,...edge());if(D>1.1)burst(T0+3*beat,...edge());}
        else if(p==='walls'){wall(T0,pk(sides));wall(T0+2*beat,pk(sides));if(D>1.1)laser(T0+3*beat);}
        else if(p==='tiles'){tiles(T0+2*beat);if(b>0)ring(T0,...corner());}
        else if(p==='spin'){spin(T0,2*bar,rn(.35,.65),rn(.35,.65));burst(T0+bar,...edge());if(!chill)burst(T0+bar+2*beat,...edge());used=2;}
        else if(p==='hole'){hole(T0,2*bar,rn(.3,.7),rn(.3,.7));laser(T0+2*beat);laser(T0+6*beat);if(!chill)laser(T0+7*beat);used=2;}
      }else if(type==='break'){
        if(!last){ring(T0,.5,.5,2);if(b%2)laser(T0+2*beat,'h',.5);}else tiles(T0+2*beat,chill?2:3);
      }else{
        if(b===0)for(let k=0;k<3;k++)ring(T0+k*beat*.5,.5,.5,1.8);
      }
      if(used===2&&type!=='outro'){note(T0+bar+beat,rn(.12,.88),rn(.15,.85));note(T0+bar+3*beat,rn(.12,.88),rn(.15,.85));}
      b+=used;
    }
    bar0+=len;
  }
  E.sort((a,b)=>a.t0-b.t0);return E;
}

/* ---------------- run state ---------------- */
let run=null,paused=false,schedTimer=null;
const PR=.26;
function startRun(si,di,stObj,off){off=off||0;
  initAudio();AC.resume();
  stopRun();
  const st=stObj||STAGES[si],df=DIFFS[di],beat=60/st.bpm;stopStudio();
  const {out,delay,bassBus}=makeBus(st.bpm);
  const barSec=[];for(const [type,len] of st.sections)for(let i=0;i<len;i++)barSec.push({type,i,len});
  run={st,df,stObj,starTotal:0,si,di,out,delay,bassBus,beat,step:beat/4,barSec,totalBars:barSec.length,start:AC.currentTime+1.5-off,nextStep:Math.round(off/(beat/4)),off,
    dur:barSec.length*4*beat,chart:buildChart(st,df,beat),ci:0,active:[],hp:df.hp,hits:0,stars:0,pops:[],combo:0,feverStart:-1,feverEnd:-1,fevers:0,smash:0,conf:[],feverNeed:df.id==='easy'?6:8,T:off-1.5,over:false,shake:0,flash:0,
    p:{x:AW/2,y:AH/2,blink:0,inv:0,dash:0,dcd:0,dx:1,dy:0,trail:[]},parts:[]};
  if(off>0)run.chart=run.chart.filter(h=>h.t>=off-.01);
  run.starTotal=run.chart.filter(h=>h.k==='note').length;
  paused=false;schedTimer=setInterval(schedule,25);schedule();
  show(null);$('#pauseBtn').classList.remove('hidden');$('#dashBtn').classList.remove('hidden');
}
function schedule(){
  const r=run;if(!r||r.over)return;
  while(r.nextStep<r.totalBars*16&&r.start+r.nextStep*r.step<AC.currentTime+.15){playStep(r,r.nextStep,r.start+r.nextStep*r.step);r.nextStep++;}
}
function stopRun(){
  if(schedTimer){clearInterval(schedTimer);schedTimer=null;}
  if(run&&run.out){const o=run.out;try{o.gain.cancelScheduledValues(AC.currentTime);o.gain.setTargetAtTime(0,AC.currentTime,.05);setTimeout(()=>{try{o.disconnect();}catch(e){}},400);}catch(e){}}
}
function endRun(win){
  const r=run;if(r.over)return;r.over=true;
  if(schedTimer){clearInterval(schedTimer);schedTimer=null;}
  if(!win){try{r.out.gain.setTargetAtTime(0,AC.currentTime,.15);}catch(e){}}
  $('#pauseBtn').classList.add('hidden');$('#dashBtn').classList.add('hidden');
  setTimeout(()=>{
    const prog=Math.min(100,Math.round(Math.max(0,r.T)/r.dur*100));
    const ratio=r.starTotal?r.stars/r.starTotal:1;let n=0;
    if(win){n=ratio>=.7?3:ratio>=.4?2:1;setBest(r.st.id,r.df.id,String(n));}
    $('#rTitle').textContent=win?(n===3?(r.hits===0?'Perfect! Superstar!':'Amazing!'):n===2?'Great job!':'You did it!'):'So close! Nice try!';
    $('#rRank').innerHTML=win?[1,2,3].map(i=>`<span style="color:${i<=n?'#ffe45c':'rgba(255,255,255,.15)'}">★</span>`).join(''):'<span style="color:#ffe45c">'+prog+'%</span>';
    $('#rStat').textContent=win?('You caught '+r.stars+' of '+r.starTotal+' stars!'):('You got '+prog+'% of the way. Let’s play again!');
    $('#rNext').classList.toggle('hidden',!(win&&!r.stObj&&r.si<STAGES.length-1));const bk=r.stObj&&r.stObj.back;$('#rStudio').classList.toggle('hidden',!bk);if(bk)$('#rStudio').textContent=bk.label;
    if(r.fevers)$('#rStat').textContent+=' 🎉 '+r.fevers+' fever part'+(r.fevers>1?'ies':'y')+'!';
    show('#result');
  },win?600:900);
}
function setPause(v){
  if(!run||run.over)return;paused=v;
  if(v){AC.suspend();show('#pause');}else{AC.resume();show(null);}
}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&run&&!run.over&&!paused)setPause(true);});

/* ---------------- input ---------------- */
const keys={};let dragId=null,lx=0,ly=0,ddx=0,ddy=0;
addEventListener('keydown',e=>{keys[e.code]=true;
  if(e.code==='Space'||e.code==='ShiftLeft'||e.code==='ShiftRight'){tryDash();e.preventDefault();}
  if(e.code==='Escape'||e.code==='KeyP'){if(run&&!run.over)setPause(!paused);}});
addEventListener('keyup',e=>{keys[e.code]=false;});
cv.addEventListener('pointerdown',e=>{
  if(!run||run.over||paused)return;
  if(dragId===null){dragId=e.pointerId;lx=e.clientX;ly=e.clientY;try{cv.setPointerCapture(e.pointerId);}catch(_){}}
  else tryDash();
});
cv.addEventListener('pointermove',e=>{if(e.pointerId!==dragId)return;ddx+=e.clientX-lx;ddy+=e.clientY-ly;lx=e.clientX;ly=e.clientY;});
const endDrag=e=>{if(e.pointerId===dragId)dragId=null;};
cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);
$('#dashBtn').addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();tryDash();});
$('#pauseBtn').addEventListener('click',()=>setPause(true));
function tryDash(){
  const r=run;if(!r||r.over||paused)return;const p=r.p;if(p.dcd>0)return;
  p.dash=.18;p.dcd=.7;sfxDash();for(let i=0;i<10;i++)spark(p.x,p.y,'#5ff6ff',3);
}

/* ---------------- helpers ---------------- */
function spark(x,y,c,sp){const a=Math.random()*6.283,v=(.5+Math.random())*sp;run.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.5+Math.random()*.4,c,s:.08+Math.random()*.12});}
const angd=(a,b)=>{let d=(a-b)%6.2832;if(d>3.1416)d-=6.2832;if(d<-3.1416)d+=6.2832;return d;};
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function spawnHaz(h,r){
  if(h.k==='tiles'){
    h.gx=Math.max(3,Math.round(AW/2.8));h.gy=Math.max(3,Math.round(AH/2.8));
    if(h.fixed){h.cells=h.fixed.map(([fx,fy])=>[clamp(Math.floor(fx*h.gx),0,h.gx-1),clamp(Math.floor(fy*h.gy),0,h.gy-1)]);return;}
    const set=new Set();const pi=clamp(Math.floor(r.p.x/AW*h.gx),0,h.gx-1),pj=clamp(Math.floor(r.p.y/AH*h.gy),0,h.gy-1);
    set.add(pi+','+pj); // the trap follows you!
    const max=Math.min(h.n+1,h.gx*h.gy-3);
    while(set.size<max)set.add(((Math.random()*h.gx)|0)+','+((Math.random()*h.gy)|0));
    h.cells=[...set].map(s=>s.split(',').map(Number));
  }
}
function hitHaz(h,T,p){
  if(T<h.t||h.smashed)return false;
  switch(h.k){

/* ---------------- update ---------------- */
function startFever(r,T){r.feverStart=T;r.feverEnd=T+r.beat*8;r.combo=0;r.fevers++;sfxFever();
  for(let i=0;i<40;i++)spark(r.p.x,r.p.y,RB[i%6],8);r.pops.push({x:r.p.x,y:r.p.y-1,text:'PARTY!',life:1.2,c:'#ffe45c'});}
function update(dt){
  const r=run;r.T=AC.currentTime-r.start;const T=r.T,p=r.p;
  while(r.ci<r.chart.length&&r.chart[r.ci].t0<=T){const h=r.chart[r.ci++];spawnHaz(h,r);r.active.push(h);}
  r.active=r.active.filter(h=>T<h.t1&&!h.got);
  r.pops.forEach(q=>{q.y-=dt*.9;q.life-=dt;});r.pops=r.pops.filter(q=>q.life>0);
  if(r.over){r.parts.forEach(q=>{q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt;});r.parts=r.parts.filter(q=>q.life>0);return;}
  let inverted=false;for(const h of r.active)if(h.k==='inv'&&T>=h.t&&T<h.end)inverted=true;
  const sgn=inverted?-1:1;
  let kx=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0),ky=(keys.ArrowDown||keys.KeyS?1:0)-(keys.ArrowUp||keys.KeyW?1:0);
  const kl=Math.hypot(kx,ky)||1;let mx=kx/kl*8.5*dt,my=ky/kl*8.5*dt;
  mx+=ddx/U*1.45;my+=ddy/U*1.45;ddx=0;ddy=0;
  mx*=sgn;my*=sgn;
  const ml=Math.hypot(mx,my);if(ml>.002){p.dx=mx/ml;p.dy=my/ml;}
  if(p.dash>0){p.x+=p.dx*20*dt;p.y+=p.dy*20*dt;p.dash-=dt;}
  p.x+=mx;p.y+=my;
  for(const h of r.active)if(h.k==='hole'&&!h.smashed&&!(T<r.feverEnd)&&T>=h.t&&T<h.end){const dx=h.fx*AW-p.x,dy=h.fy*AH-p.y,d=Math.hypot(dx,dy)||1;p.x+=dx/d*h.pull*dt;p.y+=dy/d*h.pull*dt;}
  p.x=clamp(p.x,PR,AW-PR);p.y=clamp(p.y,PR,AH-PR);
  p.dcd-=dt;p.inv-=dt;p.blink-=dt;if(p.blink<-3+Math.random())p.blink=.15;
  for(const h of r.active)if(h.k==='note'&&!h.got&&T>=h.t0+.1&&Math.hypot(p.x-h.fx*AW,p.y-h.fy*AH)<.75){
    h.got=true;const fv=T<r.feverEnd;r.stars+=fv?2:1;sfxStar(r.stars);if(!fv){r.combo++;if(r.combo>=r.feverNeed)startFever(r,T);}for(let i=0;i<14;i++)spark(h.fx*AW,h.fy*AH,'#ffe45c',4);
    const cheer=['Great!','Wow!','Awesome!','Super!','Yay!'];
    r.pops.push({x:h.fx*AW,y:h.fy*AH-.5,text:fv?'+2':r.stars%5===0?cheer[(r.stars/5-1)%cheer.length]:'+1',life:.9,c:'#ffe45c'});}
  $('#dashBtn').classList.toggle('cd',p.dcd>0);
  p.trail.unshift([p.x,p.y]);if(p.trail.length>9)p.trail.pop();
  if(T<r.feverEnd){
    for(const h of r.active)if(h.k!=='tiles'&&hitHaz(h,T,p)){h.smashed=true;r.smash++;sfxPop();
      for(let i=0;i<18;i++)spark(p.x,p.y,RB[i%6],6);r.pops.push({x:p.x,y:p.y-.8,text:pk2(['POW!','BOOM!','ZAP!','WHEE!','BONK!']),life:.8,c:RB[(Math.random()*6)|0]});}
  }else if(p.inv<=0&&p.dash<=0){
    for(const h of r.active){if(hitHaz(h,T,p)){
      r.hits++;r.combo=0;p.inv=1.5;r.shake=.2;r.flash=.12;sfxHit();try{navigator.vibrate&&navigator.vibrate(35);}catch(e){}
      for(let i=0;i<16;i++)spark(p.x,p.y,i%2?'#5ff6ff':'#ffffff',4);
      r.pops.push({x:p.x,y:p.y-.7,text:'Oops!',life:.9,c:'#ffffff'});
      if(r.df.hp>0){r.hp--;if(r.hp<=0)endRun(false);}break;}}
  }
  r.parts.forEach(q=>{q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.96;q.vy*=.96;q.life-=dt;});r.parts=r.parts.filter(q=>q.life>0);
  if(T<r.feverEnd&&Math.random()<.7)r.conf.push({x:Math.random()*AW,y:-.3,vx:Math.random()-.5,vy:2+Math.random()*2,r:0,vr:(Math.random()-.5)*8,c:RB[(Math.random()*6)|0]});
  r.conf.forEach(c=>{c.x+=c.vx*dt;c.y+=c.vy*dt;c.r+=c.vr*dt;});r.conf=r.conf.filter(c=>c.y<AH+.5);
  r.shake=Math.max(0,r.shake-dt);r.flash=Math.max(0,r.flash-dt);
  if(T>r.dur+.4)endRun(true);
}

  delete artCache[artKind];drawArt();}
function artExample(k){const p=Array(256).fill(0),set=(x,y,c)=>{if(x>=0&&y>=0&&x<16&&y<16)p[y*16+x]=c;};
  for(let y=0;y<16;y++)for(let x=0;x<16;x++){const dx=x-7.5,dy=y-7.5,r=Math.hypot(dx,dy),a=Math.atan2(dy,dx);
    if(k==='hero'&&r<7.3)set(x,y,r>6.3?2:11);
    if(k==='star'){const rr=3.2+4.4*Math.pow(.5+.5*Math.cos(5*(a+Math.PI/2)),2);if(r<rr)set(x,y,r>rr-1.3?4:5);}
    if(k==='bullet'&&dx>-6.5&&dx<6.5&&Math.abs(dy)<(6.5-dx)*.5)set(x,y,Math.abs(dy)>(6.5-dx)*.5-1.2?2:9);
    if(k==='spin'&&r<7.6){const q=(a+Math.PI)/(Math.PI/2),sec=Math.floor(q)%4;if(q%1<1-r/9)set(x,y,[3,5,6,7][sec]);else if(r<2)set(x,y,1);}}
  if(k==='hero'){[[5,6],[6,6],[5,7],[6,7],[9,6],[10,6],[9,7],[10,7]].forEach(([x,y])=>set(x,y,1));set(6,7,2);set(10,7,2);[[5,10],[6,11],[7,11],[8,11],[9,11],[10,10]].forEach(([x,y])=>set(x,y,2));set(3,9,9);set(12,9,9);}
  if(k==='star'){set(6,8,2);set(9,8,2);set(7,10,2);set(8,10,2);}
  return p;}
$('#artKinds').addEventListener('click',e=>{const b=e.target.closest('button');if(b)openArt(b.dataset.k);});
$('#artPal').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;artCol=+b.dataset.c;if(artTool==='erase')artTool='pen';if(artCol===0&&artTool==='pen')artTool='erase';openArt();});
$('#artTools').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const t=b.dataset.t,px=ART[artKind].px;
  if(t==='mirror')artMirror=!artMirror;
  else if(t==='undo'){const u=artUndo[artKind];if(u&&u.length){ART[artKind].px=u.pop();saveArt();}}
  else if(t==='clear'){pushUndo();px.fill(0);saveArt();}
  else if(t==='idea'){pushUndo();ART[artKind].px=artExample(artKind);ART[artKind].on=true;saveArt();}
  else artTool=t;openArt();});
$('#artUse').addEventListener('click',()=>{ART[artKind].on=!ART[artKind].on;saveArt();openArt();});
$('#artCv').addEventListener('pointerdown',e=>{e.preventDefault();artDown=true;pushUndo();artApply(e,true);});
$('#artCv').addEventListener('pointermove',e=>{if(artDown&&artTool!=='fill')artApply(e,false);});
addEventListener('pointerup',()=>{if(artDown){artDown=false;saveArt();drawArt();}});
$('#artBack').addEventListener('click',()=>{buildMenu();show('#menu');});
$('#toArt').addEventListener('click',()=>openArt());

/* ---------------- level maker ---------------- */
const SEC_COL={intro:'#4a4aa0',build:'#2f7fa8',drop:'#c23a8a',break:'#2f9070',drop2:'#d0602f',outro:'#5a5a70'};
const SEC_NAME={intro:'Intro',build:'Build-up',drop:'Drop! 🔥',break:'Break',drop2:'Big drop! 🔥',outro:'Ending'};
const LV_TOOLS=[['ring','⭕','Ring'],['lh','➖','Laser'],['lv','┃','Laser'],['burst','💥','Burst'],['wall','🧱','Wall'],['spin','🌀','Spinner'],['bomb','💣','Bomb'],['star','⭐','Star'],['erase','🧽','Erase']];
let LEVELS=[null,null,null];try{const v=JSON.parse(localStorage.getItem('mr_levels')||'null');if(Array.isArray(v))LEVELS=[0,1,2].map(i=>v[i]||null);}catch(e){}
function saveLevels(){try{localStorage.setItem('mr_levels',JSON.stringify(LEVELS));}catch(e){}}
const lvName=()=>pk2(ADJ)+' '+pk2(NOUN)+' '+pk2(['World','Land','Zone','Island','Castle','Planet']);
function levelBase(L){if(L.song.t==='m'&&SONGS[L.song.k])return songStage(SONGS[L.song.k],L.song.k);return STAGES[L.song.i||0];}
function levelStage(L,k){const b=levelBase(L);return {...b,id:'lvl'+k,name:L.name,sub:'My level',level:L.items,seed:b.seed+999,back:{label:'✏️ Editor',go:()=>openEditor(k)}};}
function songChoices(){const a=STAGES.map((s,i)=>({t:'s',i,name:s.name}));SONGS.forEach((sg,k)=>{if(sg)a.push({t:'m',k,name:'🎹 '+sg.name});});return a;}
let lvSlot=0,lv=null,lvBeat=0,lvTool='ring',lvSure=0;
const lvBeats=()=>levelBase(lv).sections.reduce((a,x)=>a+x[1],0)*4;
function lvSecAt(bt){let acc=0;for(const [ty,n] of levelBase(lv).sections){if(bt<(acc+n)*4)return ty;acc+=n;}return 'outro';}
function openEditor(k){if(k!=null)lvSlot=k;lv=LEVELS[lvSlot]||{name:lvName(),song:{t:'s',i:0},items:[]};
  $('#lvSlots').innerHTML=[0,1,2].map(i=>`<button data-k="${i}" class="${i===lvSlot?'on':''}">${LEVELS[i]?'🗺️':''}${i+1}</button>`).join('');
  $('#lvName').value=lv.name;$('#lvSong').textContent='🎵 '+levelBase(lv).name;
  $('#lvTools').innerHTML=LV_TOOLS.map(([k,e,l])=>`<button data-t="${k}" class="${k===lvTool?'on':''}">${e}<small>${l}</small></button>`).join('');
  lvBeat=clamp(lvBeat,0,lvBeats()-1);buildTl();show('#lvled');requestAnimationFrame(()=>{sizeLv();drawLv();updTl();});}
function lvSave(){LEVELS[lvSlot]=lv;saveLevels();}
function buildTl(){let h='',bi=0;for(const [ty,len] of levelBase(lv).sections)for(let i=0;i<len*4;i++,bi++)
  h+=`<button data-b="${bi}" style="--sc:${SEC_COL[ty]}" class="${bi%4===0?'bar':''}">${bi%4===0?(bi/4+1):'·'}<i></i></button>`;
  $('#lvTl').innerHTML=h;updTl();}
function updTl(){const cnt={};lv.items.forEach(it=>cnt[it.b]=(cnt[it.b]||0)+1);
  $('#lvTl').querySelectorAll('button').forEach(b=>{const k=+b.dataset.b;b.classList.toggle('sel',k===lvBeat);b.querySelector('i').textContent=cnt[k]?'●'.repeat(Math.min(3,cnt[k])):'';});
  const sl=$('#lvTl').querySelector('.sel'),tl=$('#lvTl');if(sl)tl.scrollLeft=sl.offsetLeft-tl.clientWidth/2;}
function sizeLv(){const m=$('#lvMain'),c=$('#lvCv'),aw=m.clientWidth,ah=m.clientHeight-54;let w=aw,h=w*9/16;if(h>ah){h=ah;w=h*16/9;}
  w=Math.max(160,w);h=w*9/16;const d=Math.min(2,devicePixelRatio||1);c.width=Math.round(w*d);c.height=Math.round(h*d);c.style.width=w+'px';c.style.height=h+'px';}
function drawItem(x,it,w,h,a,C){const u=h/9,px=(it.x||0)*w,py=(it.y||0)*h;x.save();x.globalAlpha=a;x.strokeStyle=C;x.fillStyle=C;x.lineWidth=Math.max(3,u*.18);x.lineCap='round';
  switch(it.k){
    case'ring':x.beginPath();x.arc(px,py,u*.9,-1.1,4.5);x.stroke();x.beginPath();x.arc(px,py,u*.18,0,6.3);x.fill();break;
    case'lh':x.globalAlpha=a*.85;x.fillRect(0,py-u*.4,w,u*.8);break;
    case'lv':x.globalAlpha=a*.85;x.fillRect(px-u*.4,0,u*.8,h);break;
    case'burst':for(let i=0;i<8;i++){const an=i*.785;x.beginPath();x.moveTo(px+Math.cos(an)*u*.45,py+Math.sin(an)*u*.45);x.lineTo(px+Math.cos(an)*u*1.1,py+Math.sin(an)*u*1.1);x.stroke();}
      x.beginPath();x.moveTo(px,py-u*.32);x.lineTo(px+u*.32,py);x.lineTo(px,py+u*.32);x.lineTo(px-u*.32,py);x.fill();break;
    case'wall':{const gs=2.7*u;if(it.side==='l'||it.side==='r'){const X=it.side==='l'?u*.4:w-u*.4,gc=it.g*h;x.fillRect(X-u*.35,0,u*.7,gc-gs/2);x.fillRect(X-u*.35,gc+gs/2,u*.7,h-gc-gs/2);
        x.font=`${u*.8}px sans-serif`;x.textAlign='center';x.textBaseline='middle';x.fillText(it.side==='l'?'➡':'⬅',X+(it.side==='l'?u:-u),gc);}
      else{const Y=it.side==='t'?u*.4:h-u*.4,gc=it.g*w;x.fillRect(0,Y-u*.35,gc-gs/2,u*.7);x.fillRect(gc+gs/2,Y-u*.35,w-gc-gs/2,u*.7);
        x.font=`${u*.8}px sans-serif`;x.textAlign='center';x.textBaseline='middle';x.fillText(it.side==='t'?'⬇':'⬆',gc,Y+(it.side==='t'?u:-u));}break;}
    case'spin':for(let i=0;i<3;i++){const an=i*2.094-1.57;x.beginPath();x.moveTo(px,py);x.lineTo(px+Math.cos(an)*u*2.2,py+Math.sin(an)*u*2.2);x.stroke();}x.beginPath();x.arc(px,py,u*.45,0,6.3);x.fill();break;
    case'bomb':{const cw=w/6,ch=h/3,i=clamp(Math.floor(it.x*6),0,5),j=clamp(Math.floor(it.y*3),0,2);x.globalAlpha=a*.3;x.fillRect(i*cw+3,j*ch+3,cw-6,ch-6);x.globalAlpha=a;x.strokeRect(i*cw+3,j*ch+3,cw-6,ch-6);
      x.font=`${u*1.1}px sans-serif`;x.textAlign='center';x.textBaseline='middle';x.fillText('💣',i*cw+cw/2,j*ch+ch/2);break;}
    case'star':{x.fillStyle='#ffe45c';x.beginPath();for(let i=0;i<10;i++){const an=-1.5708+i*.6283,rr=i%2?u*.25:u*.55;x[i?'lineTo':'moveTo'](px+Math.cos(an)*rr,py+Math.sin(an)*rr);}x.closePath();x.fill();break;}
  }x.restore();}
function drawLv(){const c=$('#lvCv'),x=c.getContext('2d'),w=parseFloat(c.style.width)||1,h=parseFloat(c.style.height)||1,d=c.width/w;x.setTransform(d,0,0,d,0,0);
  const base=levelBase(lv),col=base.col;x.fillStyle=col.bg;x.fillRect(0,0,w,h);x.strokeStyle=hexA(col.grid,.6);x.lineWidth=1;x.beginPath();
  for(let i=1;i<16;i++){x.moveTo(i*w/16,0);x.lineTo(i*w/16,h);}for(let j=1;j<9;j++){x.moveTo(0,j*h/9);x.lineTo(w,j*h/9);}x.stroke();
  for(const it of lv.items){let a=0;if(it.b===lvBeat)a=1;else if(it.b===lvBeat-1)a=.22;else if(it.k==='spin'&&lvBeat>it.b&&lvBeat<it.b+8)a=.3;if(a)drawItem(x,it,w,h,a,col.haz);}
  x.fillStyle='rgba(255,255,255,.85)';x.font='bold 13px system-ui';x.textAlign='left';x.textBaseline='top';
  x.fillText(`Bar ${Math.floor(lvBeat/4)+1} · Beat ${lvBeat%4+1} · ${SEC_NAME[lvSecAt(lvBeat)]}`,8,6);
  if(!lv.items.some(it=>it.b===lvBeat)){x.textAlign='center';x.textBaseline='middle';x.fillStyle='rgba(255,255,255,.5)';x.font='15px system-ui';
    const t=LV_TOOLS.find(q=>q[0]===lvTool);x.fillText(lvTool==='erase'?'Nothing on this beat':'Tap to place '+t[1]+' '+t[2],w/2,h/2);}}
function itemDist(it,fx,fy){if(it.k==='lh')return Math.abs(fy-it.y);if(it.k==='lv')return Math.abs(fx-it.x);
  if(it.k==='wall')return ({l:fx,r:1-fx,t:fy,b:1-fy}[it.side])*.6;return Math.hypot(fx-it.x,(fy-it.y)*9/16);}
function blip(on){initAudio();AC.resume();if(!stu.prev)stu.prev=makeBus(120);melNote(stu.prev,AC.currentTime+.01,on?79:67,.15,.8,'bell');}
$('#lvCv').addEventListener('pointerdown',e=>{e.preventDefault();const r=e.currentTarget.getBoundingClientRect(),fx=clamp((e.clientX-r.left)/r.width,.03,.97),fy=clamp((e.clientY-r.top)/r.height,.04,.96);
  if(lvTool==='erase'){let best=-1,bd=.09;lv.items.forEach((it,i)=>{if(it.b!==lvBeat)return;const dd=itemDist(it,fx,fy);if(dd<bd){bd=dd;best=i;}});if(best<0)return;lv.items.splice(best,1);blip(0);}
  else{if(lv.items.length>=500)return;const it={b:lvBeat,k:lvTool};
    if(lvTool==='lh')it.y=+fy.toFixed(3);else if(lvTool==='lv')it.x=+fx.toFixed(3);
    else if(lvTool==='wall'){const sd=[['l',fx*16],['r',(1-fx)*16],['t',fy*9],['b',(1-fy)*9]].sort((a,b)=>a[1]-b[1])[0][0];it.side=sd;it.g=+clamp(sd==='l'||sd==='r'?fy:fx,.2,.8).toFixed(3);}
    else{it.x=+fx.toFixed(3);it.y=+fy.toFixed(3);}lv.items.push(it);blip(1);}
  lvSave();updTl();drawLv();});
function lvGoto(b){lvBeat=clamp(b,0,lvBeats()-1);updTl();drawLv();}
$('#lvTl').addEventListener('click',e=>{const b=e.target.closest('button');if(b)lvGoto(+b.dataset.b);});
$('#lvPrev').addEventListener('click',()=>lvGoto(lvBeat-1));
$('#lvNext').addEventListener('click',()=>lvGoto(lvBeat+1));
$('#lvRepeat').addEventListener('click',()=>{if(lvBeat>=lvBeats()-1)return;const cur=lv.items.filter(it=>it.b===lvBeat);lv.items=lv.items.filter(it=>it.b!==lvBeat+1);
  cur.forEach(it=>lv.items.push({...it,b:lvBeat+1}));lvSave();lvGoto(lvBeat+1);});
$('#lvClearB').addEventListener('click',()=>{lv.items=lv.items.filter(it=>it.b!==lvBeat);lvSave();updTl();drawLv();});
$('#lvClearAll').addEventListener('click',e=>{const b=e.currentTarget;if(Date.now()-lvSure<2500){lv.items=[];lvSave();updTl();drawLv();b.textContent='🗑️ All';lvSure=0;return;}
  lvSure=Date.now();b.textContent='Sure? Tap again';setTimeout(()=>{b.textContent='🗑️ All';},2500);});
$('#lvTools').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;lvTool=b.dataset.t;
  $('#lvTools').querySelectorAll('button').forEach(q=>q.classList.toggle('on',q.dataset.t===lvTool));drawLv();});
$('#lvSlots').addEventListener('click',e=>{const b=e.target.closest('button');if(b){lvBeat=0;openEditor(+b.dataset.k);}});
$('#lvName').addEventListener('input',e=>{lv.name=e.target.value.trim()||'My Level';lvSave();});
$('#lvDice').addEventListener('click',()=>{lv.name=lvName();$('#lvName').value=lv.name;lvSave();});
$('#lvSong').addEventListener('click',()=>{const ch=songChoices();let i=ch.findIndex(c=>c.t===lv.song.t&&(c.t==='s'?c.i===lv.song.i:c.k===lv.song.k));
  const n=ch[(i+1)%ch.length];lv.song=n.t==='s'?{t:'s',i:n.i}:{t:'m',k:n.k};lvSave();openEditor();});
$('#lvTest').addEventListener('click',()=>{lvSave();const st=levelStage(lv,lvSlot),off=Math.max(0,Math.floor(lvBeat/4)*4-4)*60/st.bpm;startRun(-1,selDiff,st,off);});
$('#lvGo').addEventListener('click',()=>{lvSave();startRun(-1,selDiff,levelStage(lv,lvSlot));});
$('#lvBack').addEventListener('click',()=>{buildMenu();show('#menu');});
$('#toLevel').addEventListener('click',()=>{initAudio();openEditor();});
addEventListener('resize',()=>{if(!$('#art').classList.contains('hidden')){sizeArt();drawArt();}if(!$('#lvled').classList.contains('hidden')){sizeLv();drawLv();}});
buildMenu();
</script>
